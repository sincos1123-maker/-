<style>
/* 레이아웃: 수업 슬라이드의 노을 원시시대 세계를 그대로 이어받은 한 화면짜리 단계형 앱, 큰 터치 버튼 */

}

body{margin:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--grass) 55%,var(--grass-d));background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;word-break:keep-all;-webkit-tap-highlight-color:transparent}

@media(max-width:440px){.hpbar{width:64px}.bar b{font-size:17px}}
.hp{display:flex;align-items:center;gap:8px;font-size:14px}

/* 첫 화면: 불을 뿜는 공룡 장면 */
.scene{position:relative;aspect-ratio:16/10;max-width:100%;border:3px solid var(--earth);border-radius:22px;overflow:hidden;cursor:pointer;touch-action:manipulation;background:linear-gradient(180deg,#ff8a4c,#ffc773 62%,#6aa53f 62%,#3f7a25)}

.mgauge i{display:block;height:100%;background:var(--bad);transition:width 1s .3s}
.mnum{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scene.firing .flame{opacity:1}}
</style>

<div class="wrap">
  <div class="bar"><button class="back" id="back" hidden>← 이전</button><b id="who">원시시대 생존기</b><div class="hp">생존력 <span class="hpbar"><i id="hpfill" style="width:100%"></i></span> <span id="hpnum">100</span></div></div>
  <div class="steps" id="steps" aria-hidden="true"><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="learning-tools"><span id="save-status" role="status">학습 내용은 이 기기에 자동 저장됩니다.</span><button class="time-small" id="restart">처음부터</button></div>
  <p id="stage-label" class="stage-label" aria-live="polite"></p>
  <main id="app" tabindex="-1"></main>
</div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mbox">
    <div class="boom" id="mi">💥</div>
    <h3 id="mt">생존력 감소!</h3>
    <div class="minus" id="mm">−40</div>
    <ul id="ml"></ul>
    <div class="mgauge"><i id="mg"></i></div>
    <div class="mnum" id="mn"></div>
    <button class="btn" id="mok">확인</button>
  </div>
</div>

<script>
const S={name:'',hp:100,picks:[],noHome:false,era:0,reflection:''};
const app=document.getElementById('app');
const CARDS=[
 {id:'fire',ic:'🔥',t:'불 피우기',g:'식'},
 {id:'hunt',ic:'🍖',t:'사냥하기',g:'식'},
 {id:'cloth',ic:'🧥',t:'옷 만들기',g:'의'},
 {id:'water',ic:'💧',t:'물 찾기',g:'식'},
 {id:'home',ic:'🛖',t:'잠잘 곳 만들기',g:'주'},
 {id:'spear',ic:'🗡️',t:'무기 만들기',g:'-'}];
let fireTimer=null;
/* 화면 이동 기록: 앞으로 갈 때 쌓고, 이전 버튼으로 꺼냄 */
let cur=null,hist=[];
function updBack(){document.getElementById('back').hidden=!hist.length}
function nav(fn){if(cur)hist.push(cur);cur=fn;fn(false);updBack();saveProgress()}
function goBack(){if(!hist.length||!document.getElementById('modal').hidden)return;cur=hist.pop();cur(true);updBack();saveProgress()}
document.getElementById('back').onclick=goBack;

function hp(d){S.hp=Math.max(0,Math.min(100,S.hp+d));document.getElementById('hpfill').style.width=S.hp+'%';document.getElementById('hpnum').textContent=S.hp}
const STAGES=['생존 준비','의식주 선택','첫날 밤','옛날의 집','기술과 건설기술','건설기술의 의미','세계 건설기술','우리나라 건설기술','복습과 마무리'];
function step(n){[...document.querySelectorAll('#steps span')].forEach((s,i)=>s.classList.toggle('on',i<=n));document.getElementById('stage-label').textContent=(n+1)+' / 9 · '+STAGES[n];window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}
function h(html){if(fireTimer){clearInterval(fireTimer);fireTimer=null}app.innerHTML=html;queueMicrotask(()=>{if(!document.getElementById('modal').hidden)return;const heading=app.querySelector('h1,h2');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}})}
/* 생존력 감소 팝업 */
function loss(newHp,icon,title,reasons,cb){newHp=Math.max(0,Math.min(100,newHp));const before=S.hp,d=newHp-before;const previousFocus=document.activeElement;
 if(d>=0){hp(d);cb&&cb();return}
 document.getElementById('mi').textContent=icon;document.getElementById('mt').textContent=title;
 document.getElementById('mm').textContent='−'+(-d);
 document.getElementById('ml').innerHTML=reasons.map(r=>'<li>'+r+'</li>').join('');
 const g=document.getElementById('mg');g.style.transition='none';g.style.width=before+'%';
 document.getElementById('mn').textContent='생존력 '+before+' → '+newHp;
 const m=document.getElementById('modal');hp(d);saveProgress();m.hidden=false;document.querySelector('.wrap').inert=true;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{g.style.transition='';g.style.width=newHp+'%'}));
 const ok=document.getElementById('mok');ok.focus();m.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ok.focus()}if(e.key==='Escape'){e.preventDefault();ok.click()}};
 ok.onclick=()=>{m.hidden=true;document.querySelector('.wrap').inert=false;if(previousFocus?.isConnected)previousFocus.focus();const b=document.querySelector('.hp');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');cb&&cb()};
}

/* 불 뿜는 공룡 장면 */

 const flames=[0,.1,.2,.3,.4,.5,.6].map((d,i)=>`<circle class="flame" cx="196" cy="${118+(i%3)*3}" r="${7+(i%3)*2}" fill="${['#ffe066','#ff9f1c','#e0452b'][i%3]}" style="animation-delay:${d}s"/>`).join('');
 return `<svg viewBox="0 0 400 250" aria-hidden="true">
 <circle cx="345" cy="45" r="22" fill="#fff3c4"/>
 <path d="M60 30 q8-7 16 0 q8-7 16 0" stroke="#7a3d1e" stroke-width="3" fill="none"/>
 <path d="M300 80 q6-5 12 0 q6-5 12 0" stroke="#7a3d1e" stroke-width="3" fill="none"/>

 <g><rect x="18" y="130" width="8" height="80" fill="#7a4a24"/><path d="M22 132 q-25-8-34 10 M22 132 q25-10 36 6 M22 132 q-8-20-24-22 M22 132 q12-22 28-20" stroke="#2f7a2a" stroke-width="7" fill="none" stroke-linecap="round"/></g>
 <g class="scared"><circle cx="70" cy="185" r="14" fill="#f6d2b0"/><path d="M57 180 q13-16 26 0" fill="#2a1a10"/><circle cx="65" cy="185" r="3" fill="#fff" stroke="#000"/><circle cx="75" cy="185" r="3" fill="#fff" stroke="#000"/><ellipse cx="70" cy="193" rx="3" ry="4" fill="#7a1a10"/><rect x="58" y="199" width="24" height="24" rx="8" fill="#2f5fb3"/><path d="M58 204 l-10-16 M82 204 l10-16" stroke="#2f5fb3" stroke-width="6" stroke-linecap="round"/></g>
 <g class="dino">
  <path d="M330 150 q40-10 62-40 q-18 40-58 58 z" fill="#3f6b55"/>
  <ellipse cx="295" cy="160" rx="52" ry="34" fill="#3f6b55"/>
  <polygon points="262,128 270,112 278,128 286,110 294,128 302,112 310,130 318,116 324,134" fill="#e0452b"/>
  <polygon points="248,120 272,132 262,160 236,134" fill="#3f6b55"/>
  <rect x="270" y="182" width="16" height="32" rx="6" fill="#335a47"/>
  <rect x="308" y="182" width="16" height="32" rx="6" fill="#335a47"/>
  <path d="M255 158 l-12 6" stroke="#335a47" stroke-width="6" stroke-linecap="round"/>
  <rect class="jaw" x="204" y="116" width="50" height="11" rx="5" fill="#335a47"/>
  <rect x="200" y="94" width="62" height="26" rx="11" fill="#3f6b55"/>
  <polygon points="206,120 210,126 214,120 218,126 222,120" fill="#fff"/>
  <circle cx="244" cy="102" r="5" fill="#fff"/><circle cx="242" cy="102" r="2.5" fill="#1a1a1a"/>
  <path d="M236 94 l14-4" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="206" cy="102" r="2" fill="#1a1a1a"/>
 </g>
 ${flames}
 </svg><div class="hint">👆 공룡을 터치해 보세요!</div>`}

function fire(sc){sc.classList.add('firing','shake');setTimeout(()=>sc.classList.remove('shake'),1000);clearTimeout(sc._t);sc._t=setTimeout(()=>sc.classList.remove('firing'),1600)}

/* 1. 도입 */
function intro(){step(0);h(`<section class="card">
 <div class="eyebrow">동기 유발 · 생존 미션</div>
 <div class="scene" id="scene" role="button" tabindex="0" aria-label="불을 뿜는 공룡. 누르면 불을 뿜어요">${sceneSVG()}</div>
 <h1>원시시대에 떨어진 나의 생존 계획!</h1>
 <div class="bubble">(하품) 하… 잘 잤다! 눈을 떠 보니…<strong>어? 저건 뭐야? 공룡??! 불까지 뿜잖아!</strong></div>
 <p>해가 지기 전까지 살아남을 준비를 해야 해요. 먼저 이름을 적어 주세요.</p><p class="note">상상 속 생존 미션이에요. 실제로 사람과 비조류 공룡은 같은 시대에 살지 않았고, 공룡이 불을 뿜었다는 증거도 없어요.</p>
 <label for="nm">이름 또는 별명 (최대 10자)</label><input id="nm" maxlength="10" placeholder="이름 또는 별명" autocomplete="off">
 <button class="btn" id="go">생존 시작!</button></section>`);
 const sc=document.getElementById('scene');
 sc.onclick=()=>fire(sc);sc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fire(sc)}};
 setTimeout(()=>fire(sc),600);fireTimer=setInterval(()=>fire(sc),3500);
 const go=()=>{S.name=document.getElementById('nm').value.trim()||'생존자';document.getElementById('who').textContent=S.name+'의 생존기';nav(choose)};
 document.getElementById('nm').value=S.name;
 document.getElementById('go').onclick=go;
 document.getElementById('nm').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};
}

/* 2. 우선순위 고르기 */
function choose(){step(1);hp(100-S.hp);h(`<section class="card">
 <div class="eyebrow">미션 · 해 지기 전 3시간</div>
 <h2>무엇부터 해야 할까요? 3개만 고르세요</h2>
 <p>시간이 부족해 딱 3가지만 할 수 있어요.</p>
 <div class="grid g3">${CARDS.map(c=>`<button class="pick${S.picks.includes(c.id)?' on':''}" aria-pressed="${S.picks.includes(c.id)}" data-id="${c.id}"><span class="ic">${c.ic}</span>${c.t}</button>`).join('')}</div>
 <div class="counter" id="cnt" role="status">${S.picks.length} / 3 선택</div>
 <button class="btn" id="done" ${S.picks.length===3?'':'disabled'}>이대로 밤을 맞이하기</button></section>`);
 app.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{const id=b.dataset.id;
  if(S.picks.includes(id)){S.picks=S.picks.filter(x=>x!==id);b.classList.remove('on')}
  else if(S.picks.length<3){S.picks.push(id);b.classList.add('on')}
   else{document.getElementById('cnt').textContent='3개를 모두 골랐어요. 바꾸려면 고른 것을 먼저 취소하세요.';return}
   b.setAttribute('aria-pressed',String(S.picks.includes(id)));saveProgress();
  document.getElementById('cnt').textContent=S.picks.length+' / 3 선택';
  document.getElementById('done').disabled=S.picks.length!==3});
 document.getElementById('done').onclick=()=>nav(night);
}

/* 3. 첫날 밤 + 의식주 분류 */
function night(isBack){step(2);
 const got=g=>CARDS.filter(c=>S.picks.includes(c.id)&&c.g===g);
 S.noHome=!S.picks.includes('home');
 const box=(g,label)=>{const a=got(g);return `<div class="${a.length?'ok':(g==='주'?'miss':'')}"><b>${g}</b><small>${label}</small><small>${a.length?a.map(c=>c.ic+' '+c.t).join('<br>'):'없음'}</small></div>`};
 h(`<section class="card night">
 <div class="eyebrow">첫날 밤 · 🌧 비 + 🥶 추위 + 🦖 공룡</div>
 <h2>${S.noHome?'비와 추위를 피할 곳이 없어요!':got('의').length&&got('식').length?'의식주를 골고루 준비했어요!':'잠잘 곳은 있지만, 빠진 준비도 있어요!'}</h2>
 <p>${S.noHome?'비를 피하고 몸을 숨길 곳을 마련하는 것이 중요해요.':'집은 몸을 보호해 줘요. 옷과 먹을 것도 함께 살펴볼까요?'}</p>
 <p>내가 고른 일을 <b>인간 생활의 3대 요소</b>로 나눠 볼까요?</p>
 <div class="ijs">${box('의','옷 입기')}${box('식','밥 먹기')}${box('주','집')}</div>
 <p>${S.noHome?'<b>‘주(집)’</b>도 다른 준비만큼 중요해요.':'<b>‘주(집)’</b>를 챙겼어요. 의식주를 골고루 준비하면 더 좋아요.'} 사람들은 아주 먼 옛날부터 살 곳을 만들어 왔어요. 집이 어떻게 바뀌어 왔는지 시간 여행을 떠나 볼까요?</p>
 <p class="note">점수는 학습용 단순 모형이에요. 빠진 준비에 따라 옷 −20, 먹을 것·물 −20, 잠잘 곳 −40점을 반영해요. 실제 생존 가능성을 뜻하지 않아요.</p><button class="btn" id="nx">시간 여행 떠나기 →</button></section>`);
 document.getElementById('nx').onclick=()=>nav(houses);
 if(!isBack){const missing=[['의',20,'추위를 막을 옷이 없어 체온을 지키기 어려워요.'],['식',20,'먹을 것과 물을 마련해야 에너지를 얻어요.'],['주',40,'비와 바람을 피할 잠잘 곳이 필요해요.']].filter(([g])=>!got(g).length);if(missing.length)loss(100-missing.reduce((n,x)=>n+x[1],0),'🌧️','의식주를 함께 준비해요!',missing.map(x=>x[2]));}
}

function concept(){step(4);h(`<section class="card">

/* 6. 건설 기술의 의미와 중요성 (교과서 내용) */
function meaning(){step(5);h(`<section class="card">
 <div class="eyebrow">건설 기술이란?</div>
 <div><span class="lead">건설 기술은 공간을 창조하고 자연환경을 개선한다</span></div>
 <p>우리는 주택이나 아파트 등 잘 관리된 환경 속에서 안락함을 누리며 생활한다. 또한 강이나 바다를 가로지르는 튼튼한 교량과 잘 닦인 도로로 안전하고 쉽게 이동한다.</p>
 <div class="def">이처럼 인간이 쾌적하고 편리한 생활을 위해 자연환경과 자원을 효과적으로 활용하여 구조물이나 시설을 만들어 내는 수단이나 방법을 <em>건설 기술</em>이라고 한다.</div>
 </section>
 <section class="card">
 <div class="eyebrow">건설 기술은 왜 중요할까?</div>
 <p>건설 기술은 인간의 <b>주거지</b>뿐만 아니라 <b>복지, 산업, 환경, 교통, 에너지</b> 등 다양한 분야의 시설을 만드는 데 이용된다.</p>
 <div class="fields">
  <div class="home"><span>🏠</span><b>주거</b></div>
  <div><span>🏥</span><b>복지</b></div>
  <div><span>🏭</span><b>산업</b></div>
  <div><span>🌳</span><b>환경</b></div>
  <div><span>🚉</span><b>교통</b></div>
  <div><span>⚡</span><b>에너지</b></div>

 {name:'고대',hint:'돌과 도시',color:'#286d9b',pale:'#e7f2fa',title:'돌을 다듬어 거대한 구조물을!',need:'왕과 신의 권위를 나타내고, 사람들이 함께 살아갈 도시가 필요했어요.',material:'주로 돌을 다듬고 쌓았어요.',structure:'기둥과 보, 돌쌓기, 아치 등을 이용했어요.',change:'신전·무덤뿐 아니라 극장·도로·수도 시설도 만들었어요.',line:'사람들이 모여 살면서 건축물과 토목 시설이 함께 발전했어요.',examples:[['parthenon','파르테논 신전','그리스 · 기둥과 보'],['pyramid','피라미드','이집트 · 돌쌓기'],['road','로마 도로 유적','레바논 티레 · 이동 시설']]},
 {name:'중세',hint:'아치와 성당',color:'#137d78',pale:'#e3f4f0',title:'돌로 더 높고 넓은 공간을!',need:'종교의 영향이 커지면서 많은 사람이 모이는 성당과 수도원을 지었어요.',material:'돌과 벽돌을 많이 사용했어요.',structure:'아치·볼트가 발전하고, 고딕에서는 갈빗대 볼트와 버팀 구조를 활용했어요.',change:'로마네스크·고딕 등 다양한 건축 양식이 나타났어요.',line:'고딕의 큰 창은 아치, 볼트, 바깥 버팀 구조가 함께 만든 결과예요.',examples:[['romanesque','생트 푸아 수도원','프랑스 · 로마네스크'],['notredame','노트르담 대성당','프랑스 · 고딕'],['glass','스테인드글라스','색유리로 빛과 장식 표현']]},
 {name:'근대',hint:'철과 긴 교량',color:'#b64d2c',pale:'#fcece1',title:'새로운 재료로 더 높게, 더 길게!',need:'산업과 도시가 성장하면서 높은 건물과 긴 다리가 필요해졌어요.',material:'철·강철, 유리, 철근 콘크리트의 활용이 확대됐어요.',structure:'금속 뼈대와 강철 케이블 등을 활용했어요.',change:'구조물이 대형화·고층화되고 긴 경간의 교량이 발전했어요.',line:'재료와 시공 기술의 발전으로 더 높은 건물과 더 긴 다리가 가능해졌어요.',examples:[['flatiron','플랫아이언 빌딩','미국 · 강철 골조'],['eiffel','에펠탑','프랑스 · 연철 구조'],['brooklyn','브루클린교','미국 · 강철 케이블 현수교']]},
 {name:'현대',hint:'안전과 스마트',color:'#7d529c',pale:'#f0e9f8',title:'높이를 넘어 안전하고 쾌적하게!',need:'좁은 도시 공간을 활용하면서 안전·편리함·환경도 함께 챙겨야 해요.',material:'고강도 강재·콘크리트, 고성능 유리 등 다양한 재료를 활용해요.',structure:'초고층·지하 공간, 흔들림을 줄이는 장치, 센서와 정보 기술을 활용해요.',change:'시공의 기계화·재료의 표준화와 지능형·친환경 건설이 발전하고 있어요.',line:'현대 건설기술은 규모뿐 아니라 안전·편리함·지속가능성도 추구해요.',examples:[['taipei','타이베이 101','대만 · 초고층 건물'],['damper','동조질량감쇠기','큰 추와 감쇠 장치'],['smart','스마트 도시','도시 시설 + 정보 기술']]}
];
const TIME={era:0,seen:[false,false,false,false],layers:4,arch:0,cable:false,damper:false,wind:false,korea:0};
function timePhotos(items){return `<div class="era-photos">${items.map(([id,t,s])=>`<figure><img src="${TIME_PHOTOS[id]}" alt="${t}" loading="lazy"><figcaption><b>${t}</b><span>${s}</span></figcaption></figure>`).join('')}</div>`}
function timeSources(){return `<details class="source-box"><summary>자료와 출처 확인하기</summary><p>제공해 주신 교과서 이미지의 내용을 학습용으로 재구성했습니다. 사진도 해당 이미지에서 추출했습니다. 시대 구분은 세계 건설기술의 주요 흐름을 단순화한 것으로, 지역과 기술에 따라 시기가 겹칠 수 있습니다.</p><ul><li><a href="https://whc.unesco.org/en/list/86/" target="_blank" rel="noopener noreferrer">유네스코 세계유산센터 · 이집트 피라미드 유적</a></li><li><a href="https://www.notredamedeparis.fr/en/understand/architecture/exterior-architecture/" target="_blank" rel="noopener noreferrer">노트르담 대성당 · 고딕 구조와 바깥 버팀 구조</a></li><li><a href="https://www.toureiffel.paris/en/news/history-and-culture/15-essential-things-know-about-eiffel-tower" target="_blank" rel="noopener noreferrer">에펠탑 공식 안내 · 재료는 강철이 아닌 연철</a></li><li><a href="https://www.asce.org/about-civil-engineering/history-and-heritage/historic-landmarks/brooklyn-bridge/" target="_blank" rel="noopener noreferrer">미국토목학회 · 브루클린교의 강철 케이블</a></li><li><a href="https://www.taipei-101.com.tw/tw/observatory/feature" target="_blank" rel="noopener noreferrer">타이베이 101 · 큰 추와 유압 감쇠 장치</a></li><li><a href="https://whc.unesco.org/en/list/817/" target="_blank" rel="noopener noreferrer">유네스코 세계유산센터 · 수원 화성</a></li><li><a href="https://www.lh.or.kr/menu.es?mid=a10403020000" target="_blank" rel="noopener noreferrer">한국토지주택공사 · 스마트시티</a></li></ul></details>`}
function timeTravel(){step(6);h(`<section class="card">
 <header class="time-head"><div class="eyebrow">② 시대별 건설기술의 발달</div><h2>돌을 쌓던 시대에서<br>스마트 도시까지!</h2><p>사람들의 필요가 달라지고, 재료와 구조·시공 기술이 발전하면서 건설기술도 달라졌어요.</p></header>
 <p class="note">시대를 눌러 사진을 살펴보고, 아래의 원리 체험을 조작해 보세요.</p>
 <div class="time-map" role="tablist" aria-label="탐험할 시대">${TIME_ERAS.map((e,i)=>`<button type="button" class="time-stop" id="era-tab-${i}" role="tab" aria-controls="era-pane" aria-selected="false" data-era="${i}" style="--era-color:${e.color};--era-pale:${e.pale}"><b>${e.name}</b><small>${e.hint}</small></button>`).join('')}</div>
 <div id="era-pane" class="era-pane" role="tabpanel" tabindex="0"></div>
 <p id="era-progress" class="time-progress"></p>
 <div class="era-nav"><button class="btn alt" id="era-prev">← 이전 시대</button><button class="btn" id="era-next">다음 시대 →</button></div>
 ${timeSources()}</section>`);
 app.querySelectorAll('[data-era]').forEach(b=>{b.onclick=()=>showEra(Number(b.dataset.era));b.onkeydown=e=>{let i=Number(b.dataset.era);if(e.key==='ArrowRight')i=(i+1)%4;else if(e.key==='ArrowLeft')i=(i+3)%4;else if(e.key==='Home')i=0;else if(e.key==='End')i=3;else return;e.preventDefault();showEra(i);document.getElementById('era-tab-'+i).focus()}});
 document.getElementById('era-prev').onclick=()=>showEra(TIME.era-1);
 document.getElementById('era-next').onclick=()=>TIME.era<3?showEra(TIME.era+1):nav(koreaHistory);
 showEra(TIME.era);
}
function showEra(i){TIME.era=Math.max(0,Math.min(3,i));TIME.seen[TIME.era]=true;const e=TIME_ERAS[TIME.era];
 app.querySelectorAll('[data-era]').forEach((b,j)=>{b.setAttribute('aria-selected',String(j===TIME.era));b.tabIndex=j===TIME.era?0:-1});
 const p=document.getElementById('era-pane');p.style.setProperty('--era-color',e.color);p.style.setProperty('--era-pale',e.pale);p.setAttribute('aria-labelledby','era-tab-'+TIME.era);
 p.innerHTML=`<div class="eyebrow" style="color:${e.color}">시간 여행 ${TIME.era+1} / 4 · ${e.name}</div><h2>${e.title}</h2><div class="era-need"><span>그 시대 사람들의 필요와 욕구</span>${e.need}</div>${timePhotos(e.examples)}<div class="era-facts"><div><b>재료</b>${e.material}</div><div><b>구조·기술</b>${e.structure}</div><div><b>생활의 변화</b>${e.change}</div></div><div id="time-lab" class="time-lab"></div><p class="era-line">${e.line}</p>`;
 document.getElementById('era-progress').textContent='사진과 원리 탐험 · '+TIME.seen.filter(Boolean).length+' / 4개 시대 방문';
 document.getElementById('era-prev').disabled=TIME.era===0;document.getElementById('era-next').textContent=TIME.era===3?'우리나라로 이동 →':'다음 시대 →';
 [stoneLab,archLab,bridgeLab,towerLab][TIME.era]();saveProgress();
}
function stoneLab(){const l=document.getElementById('time-lab');l.innerHTML=`<h3>🧱 체험 · 돌을 한 층씩 쌓아 보자</h3><p>손잡이를 움직여 위로 갈수록 폭이 좁아지는 모양을 관찰해 보세요.</p><div class="lab-scene" id="stone-scene"></div><label for="stone-level">돌을 쌓은 층수 <b id="stone-count"></b></label><input type="range" id="stone-level" min="1" max="6" step="1" value="${TIME.layers}"><p class="lab-result">넓은 아래쪽이 위쪽의 무게를 받쳐요. 돌을 다듬고 운반해 계획적으로 쌓으려면 많은 사람의 협력도 필요했겠죠?</p><p class="lab-note">피라미드의 쌓기 형태를 단순화한 그림입니다. 실제 건설 공정이나 구조 안전을 계산한 모형은 아닙니다.</p>`;
 const draw=()=>{document.getElementById('stone-count').textContent=TIME.layers+'층';document.getElementById('stone-scene').innerHTML=`<svg viewBox="0 0 560 245" role="img" aria-label="아래쪽은 넓고 위쪽은 좁게 돌을 ${TIME.layers}층 쌓은 도식"><rect width="560" height="245" fill="#e8f1f3"/><circle cx="455" cy="48" r="27" fill="#ffd37a"/><path d="M0 220 Q140 175 280 220 T560 218 V245 H0" fill="#ead1a4"/>${Array.from({length:TIME.layers},(_,j)=>{const x=80+j*29,y=200-j*27,w=400-j*58;return `<g fill="${j%2?'#d2ad71':'#dfbf87'}" stroke="#8f704c" stroke-width="2"><rect x="${x}" y="${y}" width="${w}" height="27" rx="2"/>${[1,2,3,4,5].map(k=>`<path d="M${x+w*k/6} ${y}v27"/>`).join('')}</g>`}).join('')}<text x="280" y="241" text-anchor="middle" font-size="14" fill="#664b30">넓은 아래층 → 점점 좁아지는 위층</text></svg>`};
 document.getElementById('stone-level').oninput=e=>{TIME.layers=Number(e.target.value);draw()};draw();}
function archLab(){const l=document.getElementById('time-lab');l.innerHTML=`<h3>⛪ 체험 · 두 건축 양식을 바꿔 보자</h3><div class="lab-tools"><button class="time-small" id="arch-round">로마네스크</button><button class="time-small" id="arch-point">고딕</button></div><div class="lab-scene" id="arch-scene"></div><p class="lab-result" id="arch-result" aria-live="polite"></p><p class="lab-note">전형적인 특징을 비교한 개념도입니다. 뾰족아치만으로 높은 건물과 큰 창이 가능해지는 것은 아니에요.</p>`;
 const draw=()=>{const g=TIME.arch===1;document.getElementById('arch-round').setAttribute('aria-pressed',String(!g));document.getElementById('arch-point').setAttribute('aria-pressed',String(g));
 document.getElementById('arch-scene').innerHTML=`<svg viewBox="0 0 560 270" role="img" aria-label="${g?'고딕의 뾰족아치, 큰 창과 바깥 버팀 구조':'로마네스크의 반원형 아치, 두꺼운 벽과 작은 창'}"><rect width="560" height="270" fill="${g?'#e7f1fa':'#e6dfd3'}"/><rect x="100" y="${g?32:70}" width="360" height="205" fill="#b6a58d"/><path d="M100 ${g?32:70} H460" stroke="#7e705d" stroke-width="10"/>${g?'<path d="M196 230 V125 Q196 75 280 40 Q364 75 364 125 V230Z" fill="#80c1d9" stroke="#6d655d" stroke-width="12"/><path d="M280 50V230M206 150H354M231 94L330 220M330 94L231 220" stroke="#e9b36a" stroke-width="9"/><path d="M145 100 Q90 116 55 225M415 100 Q470 116 505 225" fill="none" stroke="#8c7c65" stroke-width="14"/><path d="M50 183V239M510 183V239" stroke="#786950" stroke-width="24"/>':'<path d="M238 230V150 A42 42 0 0 1 84 0V230Z" fill="#7493a5" stroke="#81715b" stroke-width="12"/><path d="M180 80V237M380 80V237" stroke="#98866b" stroke-width="35"/>'}<path d="M25 242H535" stroke="#7d8464" stroke-width="8"/><text x="280" y="263" text-anchor="middle" font-size="15" fill="#473c30">${g?'뾰족아치 · 큰 창 · 바깥 버팀 구조':'반원형 아치 · 두꺼운 벽 · 작은 창'}</text></svg>`;
 document.getElementById('arch-result').textContent=g?'고딕: 뾰족아치, 갈빗대 볼트, 바깥 버팀 구조 등을 함께 이용했어요. 벽의 부담을 줄여 높은 공간과 큰 스테인드글라스 창을 만들었어요.':'로마네스크: 반원형 아치와 두꺼운 벽, 비교적 작은 창이 특징이에요. 돌로 된 천장의 무게를 받치도록 튼튼한 벽을 만들었어요.';};
 document.getElementById('arch-round').onclick=()=>{TIME.arch=0;draw()};document.getElementById('arch-point').onclick=()=>{TIME.arch=1;draw()};draw();}
function bridgeLab(){const l=document.getElementById('time-lab');l.innerHTML=`<h3>🌉 체험 · 긴 다리의 무게는 어디로?</h3><p>강철 케이블을 연결하고, 상판의 무게가 전달되는 길을 찾아보세요.</p><div class="lab-tools"><button class="time-small" id="bridge-off">케이블 숨기기</button><button class="time-small" id="bridge-on">케이블 연결하기</button></div><div class="lab-scene" id="bridge-scene"></div><p class="lab-result" id="bridge-result" aria-live="polite"></p><p class="lab-note">일반적인 현수교의 개념도입니다. 브루클린교의 실제 형상과 치수를 재현하거나 하중을 계산한 모형은 아닙니다.</p>`;
 const draw=()=>{const on=TIME.cable;document.getElementById('bridge-on').setAttribute('aria-pressed',String(on));document.getElementById('bridge-off').setAttribute('aria-pressed',String(!on));document.getElementById('bridge-scene').innerHTML=`<svg viewBox="0 0 560 255" role="img" aria-label="${on?'상판에서 연결줄, 주케이블, 주탑과 양 끝 정착부로 무게가 전달되는 현수교':'주탑과 상판만 보이는 현수교 도식'}"><rect width="560" height="255" fill="#e3eff7"/><rect y="204" width="560" height="51" fill="#89b7c6"/><path d="M0 234Q40 222 80 234T240 234T400 234T560 234" fill="none" stroke="#d3e8ef" stroke-width="3"/><g fill="#af9b83" stroke="#655340" stroke-width="3"><rect x="118" y="45" width="24" height="178"/><rect x="418" y="45" width="24" height="178"/><rect x="14" y="178" width="40" height="45"/><rect x="506" y="178" width="40" height="45"/></g><path d="M25 181H535" stroke="#535d62" stroke-width="13"/>${on?`<path d="M32 193 L130 47 Q280 213 430 47 L528 193" fill="none" stroke="#bd512e" stroke-width="6"/>${Array.from({length:11},(_,i)=>{const x=155+i*25,t=(x-130)/300,y=47+332*t*(1-t);return `<path d="M${x} ${y}V177" stroke="#986145" stroke-width="2.5"/>`}).join('')}<path d="M280 158V126M273 137L280 126L287 137" stroke="#b74c2c" stroke-width="3" fill="none"/><text x="280" y="28" text-anchor="middle" font-size="16" fill="#8f3e27">상판 → 연결줄 → 주케이블 → 주탑·정착부</text>`:'<text x="280" y="110" text-anchor="middle" font-size="17" fill="#645644">긴 상판을 무엇으로 지탱할까요?</text>'}<text x="280" y="250" text-anchor="middle" font-size="14" fill="#3d5964">강을 건너는 넓은 공간</text></svg>`;document.getElementById('bridge-result').textContent=on?'강철 케이블이 당기는 힘을 받아 상판을 지탱해요. 무게는 주탑과 양 끝의 정착부를 거쳐 땅으로 전달돼요.':'케이블을 숨겨 보니 상판을 받치는 연결 구조가 보이지 않아요. 케이블을 연결해 긴 상판을 어떻게 지탱하는지 살펴보세요.';};
 document.getElementById('bridge-off').onclick=()=>{TIME.cable=false;draw()};document.getElementById('bridge-on').onclick=()=>{TIME.cable=true;draw()};draw();}
function towerLab(){const l=document.getElementById('time-lab');l.innerHTML=`<h3>🏙️ 체험 · 높은 건물의 흔들림 줄이기</h3><p>바람을 켠 다음, 건물 상층부에 큰 추와 감쇠 장치를 설치해 보세요.</p><div class="lab-tools"><button class="time-small" id="wind-toggle">바람 켜기</button><button class="time-small" id="damper-toggle">감쇠 장치 설치</button></div><div class="lab-scene" id="tower-scene"></div><p class="lab-result" id="tower-result" aria-live="polite"></p><p class="lab-note">같은 바람에서 감쇠 장치 유무를 비교한 원리 애니메이션입니다. 움직임은 이해를 돕기 위해 과장했으며, 실제 진동량·감소율을 계산하지 않았어요. 기기의 동작 줄이기 설정에서는 그림이 정지해요.</p>`;
 const draw=()=>{const on=TIME.damper,w=TIME.wind;document.getElementById('wind-toggle').setAttribute('aria-pressed',String(w));document.getElementById('wind-toggle').textContent=w?'바람 끄기':'바람 켜기';document.getElementById('damper-toggle').setAttribute('aria-pressed',String(on));document.getElementById('damper-toggle').textContent=on?'감쇠 장치 제거':'감쇠 장치 설치';
 document.getElementById('tower-scene').innerHTML=`<svg viewBox="0 0 560 280" role="img" aria-label="${w?'바람이 불 때 '+(on?'큰 추와 감쇠 장치로 흔들림을 줄인':'흔들리는')+' 초고층 건물':'바람이 없는 초고층 건물'}"><rect width="560" height="280" fill="#e7ecf5"/><g fill="#c9d0dc"><rect x="24" y="165" width="55" height="90"/><rect x="88" y="193" width="70" height="62"/><rect x="413" y="170" width="60" height="85"/><rect x="484" y="209" width="60" height="46"/></g>${w?'<g stroke="#649dbf" stroke-width="4" fill="none"><path d="M30 75H160M146 65L160 75L146 85M65 120H190M176 110L190 120L176 130"/></g>':''}<g class="${w?'tower-move'+(on?' calm':''):''}"><path d="M220 253V68L238 56V34H322V56L340 68V253Z" fill="#6d8c9a" stroke="#3e5d70" stroke-width="3"/><path d="M280 34V13" stroke="#3e5d70" stroke-width="4"/><g stroke="#b5d6df" stroke-width="3">${[160,180,200,220,240].map(y=>`<path d="M229 ${y}H331"/>`).join('')}</g><rect x="238" y="65" width="84" height="84" rx="3" fill="#f2ebdb"/>${on?`<g class="${w?'damper-move':''}"><path d="M254 65L280 110L306 65" fill="none" stroke="#5e6570" stroke-width="2.5"/><circle cx="280" cy="111" r="22" fill="#e8ac37" stroke="#a56827" stroke-width="3"/></g><path d="M250 137L280 125L310 137" fill="none" stroke="#a56827" stroke-width="4"/>`:'<text x="280" y="112" text-anchor="middle" font-size="15" fill="#7c7167">장치 없음</text>'}</g><path d="M15 256H545" stroke="#626b74" stroke-width="7"/><text x="280" y="277" text-anchor="middle" font-size="14" fill="#49516a">${w?(on?'같은 바람 · 흔들림이 줄어든 모습':'바람에 의해 건물이 흔들리는 모습'):'바람을 켜서 비교해 보세요'}</text></svg>`;
 document.getElementById('tower-result').textContent=!w?'타이베이 101에는 약 660톤의 큰 추가 매달려 있어요. 바람을 켜고 장치 유무를 비교해 보세요.':on?'동조질량감쇠기(TMD): 큰 추가 건물의 움직임에 맞춰 상대적으로 움직이고, 유압 감쇠 장치가 진동 에너지를 소모해 건물의 흔들림을 줄여요.':'초고층 건물은 바람에 흔들릴 수 있어요. 같은 바람을 유지한 채 감쇠 장치를 설치해 보세요.';};
 document.getElementById('wind-toggle').onclick=()=>{TIME.wind=!TIME.wind;draw()};document.getElementById('damper-toggle').onclick=()=>{TIME.damper=!TIME.damper;draw()};draw();}
const KOREA_STAGES=[
 {title:'전통적인 건설기술',when:'기후와 자연에 적응',photo:'k-tradition',caption:'부석사 무량수전 · 불국사 극락전 · 수원 화성',need:'여름에는 시원하고 겨울에는 따뜻하게 지내고, 지형과 자연에 맞는 공간이 필요했어요.',tech:'목재·흙·돌·기와로 집과 시설을 지었어요. 온돌·마루·처마를 활용하고, 돌을 가공한 석조 구조물도 만들었어요.',life:'자연환경에 적응한 생활 공간을 만들었어요. 수원 화성처럼 과학 지식과 새로운 건설 방법을 적용한 시설도 나타났어요.'},
 {title:'도시화와 교통 기반 시설',when:'20세기 중반 이후',photo:'k-transport',caption:'강을 건너는 교량 · 지하철 · 고속도로',need:'도시 인구와 이동량이 늘어나 사람과 물자를 빠르게 이동시킬 시설이 필요했어요.',tech:'교량·철도·지하철·고속도로 등 교통 기반 시설을 확충했어요.',life:'지역 사이의 이동과 물자 수송이 편리해지고 도시의 생활권도 넓어졌어요.'},
 {title:'고층 건물과 지하 공간',when:'도시 공간을 입체적으로 활용',photo:'k-space',caption:'고층 주거 · 지하 주차장 · 지하 배관 시설',need:'도시의 한정된 땅에서 많은 사람이 생활할 공간과 시설을 확보해야 했어요.',tech:'고층 건물을 짓고 지하에 주차장·상하수도·공동구 등 다양한 시설을 배치했어요.',life:'도시 공간을 위아래로 활용했어요. 지하 공간의 안전과 유지관리도 중요해졌어요.'},
 {title:'지능형·친환경 건설',when:'안전·편리함·지속가능성',photo:'k-smart',caption:'센서와 정보 기술 · 초고층 건물 · 친환경 건축',need:'에너지를 아끼고 환경 부담을 줄이면서 안전하고 편리하게 생활하고 싶어요.',tech:'센서·정보 기술로 건물과 도시를 관리하고, 단열·자연채광·녹화 등으로 에너지 사용과 환경 부담을 줄여요.',life:'건물의 에너지와 설비를 효율적으로 관리하고 지속가능한 생활 환경을 추구해요.'}
];
function koreaHistory(){step(7);h(`<section class="card"><div class="eyebrow">우리나라 건설기술의 발달</div><h2>우리 주변의 공간도 이렇게 바뀌었어요</h2><p>각 단계를 눌러 <b>사람들의 필요 → 건설기술 → 생활의 변화</b>를 연결해 보세요.</p><div class="k-map">${KOREA_STAGES.map((k,i)=>`<button class="k-stop" data-korea="${i}" aria-pressed="false"><b>${i+1}. ${k.title}</b><small>${k.when}</small></button>`).join('')}</div><div class="k-story" id="k-story"></div></section><section class="card"><div class="eyebrow">시대가 달라도 이어지는 공통점</div><h2>사람들의 필요와 욕구를 해결해요</h2><div class="time-recap"><div><b>고대</b>돌과 도시</div><div><b>중세</b>아치와 성당</div><div><b>근대</b>새 재료와 대형화</div><div><b>현대</b>안전·스마트·친환경</div></div><p class="sum">건설기술은 <mark>사람들의 필요와 욕구</mark>를 해결하기 위해 발전해 왔어요. <mark>재료·구조·시공 기술</mark>이 발달하면서 만들 수 있는 공간도 넓어졌어요.</p><p class="note">각 단계는 주요 변화를 정리한 흐름이에요. 전통 기술과 새로운 기술은 오늘날에도 함께 쓰여요.</p><button class="btn" id="nx">탐험을 마무리하기 →</button>${timeSources()}</section>`);
 app.querySelectorAll('[data-korea]').forEach(b=>b.onclick=()=>showKorea(Number(b.dataset.korea)));document.getElementById('nx').onclick=()=>nav(finale);showKorea(TIME.korea);}
function showKorea(i){TIME.korea=i;const k=KOREA_STAGES[i];app.querySelectorAll('[data-korea]').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.getElementById('k-story').innerHTML=`<h3>${k.title}</h3><figure><img src="${TIME_PHOTOS[k.photo]}" alt="${k.caption}" loading="lazy"><figcaption>${k.caption}</figcaption></figure><div class="k-chain"><div><b>① 어떤 필요가 생겼을까?</b>${k.need}</div><div><b>② 어떤 기술을 사용했을까?</b>${k.tech}</div><div><b>③ 생활이 어떻게 달라졌을까?</b>${k.life}</div></div>`;}
function resetTimeTravel(){Object.assign(TIME,{era:0,seen:[false,false,false,false],layers:4,arch:0,cable:false,damper:false,wind:false,korea:0})}

/* Local-only storage: no names or reflections are sent to a server. */
const SAVE_KEY='dino-construction-learning-v2';
const ROUTES={intro,choose,night,houses,concept,meaning,timeTravel,koreaHistory,finale};
const QUIZ=[
 {q:'의식주를 골고루 준비한 선택은 무엇일까요?',options:['불 피우기 · 사냥하기 · 물 찾기','옷 만들기 · 물 찾기 · 잠잘 곳 만들기','사냥하기 · 무기 만들기 · 불 피우기'],answer:1,why:'옷은 의, 물은 식, 잠잘 곳은 주에 해당해요. 한 가지에만 치우치지 않도록 준비해요.'},
 {q:'건설기술이 발달하는 가장 근본적인 까닭은?',options:['사람들의 필요와 욕구를 해결하려고','항상 더 높은 건물만 지으려고','옛날 건물을 모두 없애려고'],answer:0,why:'쾌적한 집, 편리한 교통, 안전한 도시 등 사람들의 필요와 욕구를 해결하기 위해 발달해요.'},
 {q:'긴 현수교에서 상판의 무게를 전달하는 데 쓰이는 것은?',options:['스테인드글라스','온돌','강철 케이블'],answer:2,why:'상판의 무게는 행어와 주 케이블을 거쳐 주탑과 정착부 등으로 전달돼요. 실제 설계에는 여러 요소를 함께 고려해요.'},
 {q:'초고층 건물의 큰 추와 감쇠 장치는 어떤 역할을 할까요?',options:['건물을 계속 높여 줘요','진동 에너지를 소모해 흔들림을 줄여요','바람을 완전히 멈춰 줘요'],answer:1,why:'동조질량감쇠기는 건물과 상대적으로 움직이는 추와 감쇠 장치를 이용해 흔들림을 줄여요. 바람 자체를 없애지는 않아요.'}
];
let answers=QUIZ.map(()=>null);
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function storageMessage(message){document.getElementById('save-status').textContent=message}
function saveProgress(){
 if(!cur)return;
 try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:2,state:S,time:TIME,answers,route:cur.name,history:hist.map(fn=>fn.name)}));storageMessage('자동 저장됨 · 이 기기/브라우저에만 보관돼요.')}
 catch{storageMessage('자동 저장을 사용할 수 없어요. 마지막 화면에서 결과 파일을 저장해 주세요.')}
}
function bounded(n,min,max,fallback){return Number.isInteger(n)&&n>=min&&n<=max?n:fallback}
function restoreProgress(){
 let data=null,failed=false;
 try{const raw=localStorage.getItem(SAVE_KEY);if(raw)data=JSON.parse(raw)}catch{failed=true}
 if(data&&data.version===2&&data.state&&data.time&&Object.hasOwn(ROUTES,data.route)){
  const p=data.state,t=data.time;
  S.name=typeof p.name==='string'?p.name.slice(0,10):'';
  S.hp=bounded(p.hp,0,100,100);
  S.picks=Array.isArray(p.picks)?[...new Set(p.picks.filter(id=>CARDS.some(c=>c.id===id)))].slice(0,3):[];
  S.noHome=!S.picks.includes('home');S.reflection=typeof p.reflection==='string'?p.reflection.slice(0,1000):'';
  TIME.era=bounded(t.era,0,3,0);TIME.layers=bounded(t.layers,1,6,4);TIME.arch=bounded(t.arch,0,1,0);TIME.korea=bounded(t.korea,0,3,0);
  TIME.seen=Array.from({length:4},(_,i)=>t.seen?.[i]===true);
  for(const k of ['cable','damper','wind'])TIME[k]=t[k]===true;
  answers=QUIZ.map((q,i)=>bounded(data.answers?.[i],0,q.options.length-1,null));
  hist=Array.isArray(data.history)?data.history.filter(k=>Object.hasOwn(ROUTES,k)).slice(0,30).map(k=>ROUTES[k]):[];
  cur=ROUTES[data.route];
  if(cur!==intro&&(!S.name||S.picks.length!==3&&cur!==choose)){cur=choose;hist=[intro]}
  hp(0);document.getElementById('who').textContent=S.name?S.name+'의 생존기':'원시시대 생존기';cur(true);updBack();storageMessage('저장된 학습을 이어서 시작했어요.');
 }else{cur=intro;intro();updBack();if(data||failed)storageMessage('저장된 학습을 읽을 수 없어 처음 화면을 열었어요.')}
}
function restart(){
 if(!confirm('이 기기에 저장된 이름, 선택, 소감과 퀴즈 기록을 지우고 처음부터 시작할까요?'))return;
 resetTimeTravel();Object.assign(S,{name:'',hp:100,picks:[],noHome:false,era:0,reflection:''});answers=QUIZ.map(()=>null);hist=[];cur=intro;
 hp(0);document.getElementById('who').textContent='원시시대 생존기';intro();updBack();saveProgress();
}
function renderQuiz(focusId){
 const count=answers.filter(a=>a!==null).length,correct=answers.filter((a,i)=>a===QUIZ[i].answer).length;
 document.getElementById('quiz').innerHTML=QUIZ.map((q,i)=>`<fieldset class="question"><legend>${i+1}. ${q.q}</legend><div class="quiz-options">${q.options.map((o,j)=>`<button type="button" id="answer-${i}-${j}" data-question="${i}" data-answer="${j}" aria-pressed="${answers[i]===j}" aria-describedby="feedback-${i}">${j+1}. ${o}</button>`).join('')}</div><p id="feedback-${i}" class="quiz-feedback">${answers[i]===null?'답을 골라 보세요.':(answers[i]===q.answer?'✅ 정답이에요! ':'💡 다시 생각해 봐요. ')+q.why}</p></fieldset>`).join('')+`<p class="quiz-score" role="status">복습 ${count} / ${QUIZ.length}문항 응답 · 현재 정답 ${correct}개${count===QUIZ.length?' · 해설을 읽고 답을 바꿔도 좋아요.':''}</p>`;
 document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{answers[Number(b.dataset.question)]=Number(b.dataset.answer);saveProgress();renderQuiz(b.id)});
 if(focusId)document.getElementById(focusId)?.focus({preventScroll:true});
}
function downloadReport(){
 S.reflection=document.getElementById('ref').value;saveProgress();
 const lines=['공룡시대 생존기 · 건설기술 학습 기록','기록 시각: '+new Date().toLocaleString('ko-KR'),'', '이름: '+S.name,'생존력: '+S.hp+'점 (학습용 단순 모형)', '나의 준비: '+CARDS.filter(c=>S.picks.includes(c.id)).map(c=>c.t).join(', '),'방문한 시대: '+TIME_ERAS.filter((_,i)=>TIME.seen[i]).map(e=>e.name).join(', '),'', '복습: '+answers.filter((a,i)=>a===QUIZ[i].answer).length+' / '+QUIZ.length+'개 정답 (현재 선택)'];
 QUIZ.forEach((q,i)=>lines.push((i+1)+'. '+q.q,'나의 답: '+(answers[i]===null?'미응답':q.options[answers[i]]),'정답: '+q.options[q.answer],'해설: '+q.why,''));
 lines.push('한 줄 소감',S.reflection||'(아직 작성하지 않았어요)');
 const url=URL.createObjectURL(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='건설기술_학습기록.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
 document.getElementById('msg').textContent='학습 결과 파일 저장을 요청했어요. 브라우저 다운로드를 확인하세요.';
}
document.getElementById('restart').onclick=restart;
app.addEventListener('input',e=>{if(e.target.id==='nm')S.name=e.target.value.slice(0,10);saveProgress()});
app.addEventListener('click',()=>saveProgress());

restoreProgress();
</script>
